<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Regístrate — Postulación Totis</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="auth-screen">
        <div class="auth-card">

            <div class="auth-brand">
                <img src="assets/logo-totis.png" alt="Totis">
                <h1>Postúlate como Ayudante General</h1>
                <p>Completa tus datos para registrarte</p>
            </div>

            <div id="registroAlert" class="alert alert-error" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="registroAlertText">Completa los campos obligatorios.</span>
            </div>

            <div id="registroSuccess" class="alert alert-success" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span>¡Registro recibido! Nos pondremos en contacto contigo pronto.</span>
            </div>

            <form id="registroForm" novalidate>
                <div class="form-field">
                    <label for="regNombre">Nombre completo <span class="required">*</span></label>
                    <input type="text" id="regNombre" class="input" placeholder="Ej. Juan Pérez López" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="regTelefono">Teléfono <span class="required">*</span></label>
                    <input type="tel" id="regTelefono" class="input" placeholder="Ej. 55 1234 5678" autocomplete="tel" required>
                </div>

                <button type="submit" class="btn-primary">
                    Enviar postulación
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        // --- REGISTRO ---
        // Envía nombre/teléfono al backend real de AGYDA/Omnicanal (misma
        // campaña "totis" que ya consume contacto.html) y solo entonces
        // redirige — si el guardado falla, el postulante se entera en vez de
        // perder sus datos en silencio. Correo y redes sociales se quitaron
        // del formulario (solo se pide lo mínimo); el backend los sigue
        // aceptando como opcionales si algún día se reactivan.
        const API_BASE = 'https://agyda.ardabytec.vip';
        const CAMPANIA_SLUG = 'totis';

        const registroForm = document.getElementById('registroForm');
        const registroAlert = document.getElementById('registroAlert');
        const registroAlertText = document.getElementById('registroAlertText');
        const registroSuccess = document.getElementById('registroSuccess');
        const submitBtn = registroForm.querySelector('button[type="submit"]');

        registroForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const telefono = document.getElementById('regTelefono').value.trim();

            registroAlert.style.display = 'none';
            registroSuccess.style.display = 'none';

            if (!nombre || !telefono) {
                registroAlertText.textContent = 'Nombre y teléfono son obligatorios.';
                registroAlert.style.display = 'flex';
                return;
            }

            const telefonoDigitos = telefono.replace(/\D/g, '');
            if (telefonoDigitos.length < 10) {
                registroAlertText.textContent = 'Ingresa un teléfono válido (al menos 10 dígitos).';
                registroAlert.style.display = 'flex';
                return;
            }

            submitBtn.disabled = true;
            try {
                const resp = await fetch(`${API_BASE}/api/contact-center/publico/campanias/${CAMPANIA_SLUG}/postulantes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, telefono: telefonoDigitos }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.success) {
                    throw new Error(data.message || 'No se pudo registrar la postulación.');
                }
                registroSuccess.style.display = 'flex';
                window.location.href = 'contacto.html';
            } catch (err) {
                registroAlertText.textContent = err.message || 'Ocurrió un error al enviar tu postulación. Intenta de nuevo.';
                registroAlert.style.display = 'flex';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
