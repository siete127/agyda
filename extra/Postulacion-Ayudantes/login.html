<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Iniciar sesión — Postulación Totis</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="auth-screen">
        <div class="auth-card">

            <div class="auth-brand">
                <img src="assets/logo-totis.png" alt="Totis">
                <h1>Postulación de Ayudantes</h1>
                <p>Inicia sesión para continuar</p>
            </div>

            <div id="loginAlert" class="alert alert-error" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="loginAlertText">Usuario o contraseña incorrectos.</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-field">
                    <label for="loginUsuario">Usuario</label>
                    <div class="input-with-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="loginUsuario" class="input" placeholder="Tu usuario" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="loginPassword">Contraseña</label>
                    <div class="input-with-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="loginPassword" class="input" style="padding-right:42px;" placeholder="Tu contraseña" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Iniciar sesión
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <p class="auth-footer-link">
                ¿Quieres postularte como ayudante general? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        // --- LOGIN (solo frontend, sin backend todavía) ---
        // Cualquier usuario/contraseña no vacíos "inician sesión" y guardan
        // una bandera simulada en localStorage. BlackList revisa esa bandera
        // para decidir si deja pasar o redirige de vuelta aquí.
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const loginAlertText = document.getElementById('loginAlertText');

        // Si ya había una sesión simulada activa, entra directo a BlackList.
        if (PostulacionAuth.isLoggedIn()) {
            window.location.replace('blacklist.html');
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!usuario || !password) {
                loginAlertText.textContent = 'Ingresa tu usuario y contraseña.';
                loginAlert.style.display = 'flex';
                return;
            }

            loginAlert.style.display = 'none';
            PostulacionAuth.login(usuario);
            window.location.href = 'blacklist.html';
        });

        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('loginPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>

</html>
