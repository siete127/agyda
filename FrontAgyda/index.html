<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArdaBy Tec - AGYDA</title>
    <meta name="copyright" content="Copyright (c) 2026 ArdaBytec. Todos los derechos reservados." />
    <meta name="application-version" content="20.11.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Anti-flash: aplica el tema guardado antes del primer paint.
         'system' (o sin valor) => sin data-theme, cae al @media del CSS. */
      try {
        var t = JSON.parse(localStorage.getItem('theme-store') || '{}').state;
        var m = t && t.theme;
        if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
